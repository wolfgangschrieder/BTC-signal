name: CI

on:
  push:
    branches: ["main", "stage-*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: research_os
          POSTGRES_PASSWORD: research_os
          POSTGRES_DB: research_os
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U research_os -d research_os"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://research_os:research_os@localhost:5433/research_os
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: alembic heads
      - run: alembic upgrade head
      - run: pytest -q
      - name: Non-root storage volume probe
        run: |
          probe_dir=$(mktemp -d)
          chmod 700 "$probe_dir"
          docker run --rm --user 10001:10001 --mount "type=bind,src=$probe_dir,dst=/postgres-storage,readonly" python:3.12-slim-bookworm python -c "import shutil; assert shutil.disk_usage('/postgres-storage').free > 0"
          rmdir "$probe_dir"
      - name: Hot-path benchmark smoke
        run: python tests/benchmark_hot_path.py --iterations 200 --warmup 50
