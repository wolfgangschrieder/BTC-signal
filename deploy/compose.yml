name: btc-signal-shadow
services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_os -d research_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    build:
      context: ..
    image: btc-signal:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://research_os:${POSTGRES_PASSWORD}@postgres:5432/research_os
    depends_on:
      postgres:
        condition: service_healthy
  app:
    image: btc-signal:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://research_os:${POSTGRES_PASSWORD}@postgres:5432/research_os
      ENVIRONMENT: ${ENVIRONMENT:-shadow}
      LIVE_HISTORY_MINUTES: ${LIVE_HISTORY_MINUTES:-10080}
      SIGNAL_MIN_PROBABILITY: ${SIGNAL_MIN_PROBABILITY:-0.70}
      CROSS_MARKET_ENABLED: ${CROSS_MARKET_ENABLED:-false}
      CROSS_MARKET_REFRESH_SECONDS: ${CROSS_MARKET_REFRESH_SECONDS:-60}
      CROSS_MARKET_CACHE_MAX_AGE_SECONDS: ${CROSS_MARKET_CACHE_MAX_AGE_SECONDS:-120}
      CROSS_MARKET_MAX_EVENT_AGE_DAYS: ${CROSS_MARKET_MAX_EVENT_AGE_DAYS:-7}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CALIBRATION_MODEL_IDS: ${CALIBRATION_MODEL_IDS:-}
      CALIBRATION_MAX_AGE_DAYS: ${CALIBRATION_MAX_AGE_DAYS:-30}
      SIGNAL_MIN_EV: ${SIGNAL_MIN_EV:-0.0}
      EXECUTION_FEE_BPS: ${EXECUTION_FEE_BPS:-0}
      EXECUTION_SLIPPAGE_BPS: ${EXECUTION_SLIPPAGE_BPS:-0}
      STORAGE_PATH: /postgres-storage
      STORAGE_MAX_DATABASE_GB: ${STORAGE_MAX_DATABASE_GB:-18}
      STORAGE_MIN_FREE_GB: ${STORAGE_MIN_FREE_GB:-5}
      RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-6}
      SIGNAL_EMISSION_ENABLED: ${SIGNAL_EMISSION_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REPORT_TIMEZONE: Europe/Moscow
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - postgres_data:/postgres-storage:ro
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  auditor:
    profiles: [auditor]
    image: btc-signal:local
    command: ["research-os", "auditor"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: postgresql+psycopg://research_os:${POSTGRES_PASSWORD}@postgres:5432/research_os
      AUDITOR_ENABLED: ${AUDITOR_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AUDITOR_MODEL: ${AUDITOR_MODEL:-deepseek-flash}
      AUDITOR_DAILY_TOKEN_BUDGET: ${AUDITOR_DAILY_TOKEN_BUDGET:-1000000}
      AUDITOR_MAX_OUTPUT_TOKENS: ${AUDITOR_MAX_OUTPUT_TOKENS:-2200}
      AUDITOR_RETENTION_DAYS: ${AUDITOR_RETENTION_DAYS:-7}
      AUDITOR_TELEGRAM_ENABLED: ${AUDITOR_TELEGRAM_ENABLED:-true}
      SIGNAL_MIN_PROBABILITY: ${SIGNAL_MIN_PROBABILITY:-0.70}
      CALIBRATION_MODEL_IDS: ${CALIBRATION_MODEL_IDS:-}
      EXECUTION_FEE_BPS: ${EXECUTION_FEE_BPS:-0}
      EXECUTION_SLIPPAGE_BPS: ${EXECUTION_SLIPPAGE_BPS:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STORAGE_PATH: /postgres-storage
      STORAGE_MAX_DATABASE_GB: ${STORAGE_MAX_DATABASE_GB:-18}
      STORAGE_MIN_FREE_GB: ${STORAGE_MIN_FREE_GB:-5}
    volumes:
      - postgres_data:/postgres-storage:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
